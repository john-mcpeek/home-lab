#Cloud-config
merge_how:
  - name: list
    settings: [ append ]
  - name: dict
    settings: [ no_replace, recurse_list ]

hostname: ${HOST_NAME}

users:
  - default
  - name: john
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${MY_PUBLIC_KEY}
      - ${PROXMOX_ROOT_PUBLIC_KEY}

package_update: true
package_upgrade: true
package_reboot_if_required: true

apt:
  preserve_sources_list: true
  sources:
    docker:
      source: deb [arch="amd64" signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable
      keyid: 8D81803C0EBFCD88

packages:
  - build-essential
  - containerd.io
  - docker-ce
  - docker-ce-cli
  - docker-buildx-plugin
  - git
  - make
  - curl
  - jq
  - unzip
  - python3-venv

write_files:
  - path: /cluster-api/image-builder/proxmox.env
    permissions: '0755'
    content: |
      export PROXMOX_BRIDGE=vmbr0
      export PROXMOX_ISO_POOL=local
      export PROXMOX_NODE=pve
      export PROXMOX_STORAGE_POOL=local
      export PROXMOX_TOKEN=${PROXMOX_SECRET}
      export PROXMOX_URL=https://${PROXMOX_IP}:8006/api2/json
      export PROXMOX_USERNAME=image-builder@pve!capi
      export PACKER_VAR_FILES=/cluster-api/image-builder/proxmox_packer_overrides.json
  - path: /cluster-api/image-builder/proxmox_packer_overrides.json
    permissions: '0755'
    content: |
      {
        "vmid": "${CAPI_NODE_VM_ID}",
        "sockets": "1",
        "cores": "2",
        "cpu_type": "host",
        "memory": "8192",
        "disk_format": "raw",
        "nameservers": "10.0.0.10 8.8.8.8"
      }
  - path: /cluster-api/image-builder/build-capi-base-image.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      
      echo "Building the base image"
      echo "Removing existing image-builder directory"
      rm -rf capi-image-builder
      
      echo "Cloning kubernetes-sigs/image-builder..."
      git clone https://github.com/kubernetes-sigs/image-builder.git --depth 1 capi-image-builder
      
      echo "Setting up Packer environment..."
      source /cluster-api/image-builder/proxmox.env

      cd capi-image-builder/images/capi

      python3 -m venv capi-image-builder-venv
      source capi-image-builder-venv/bin/activate
      
      export PACKER_FLAGS="--var 'kubernetes_series=v${K8S_SERIES}' --var 'kubernetes_semver=v${K8S_VERSION}' --var 'kubernetes_deb_version=${K8S_VERSION}-1.1' --var 'crictl_version=${K8S_SERIES}.0'"
      echo "Packer flags: ${PACKER_FLAGS}"
      
      echo "Installing build dependencies (Packer, etc.)..."
      make deps-proxmox

      echo "Building CAPI Proxmox template (Ubuntu 24.04 + Kubernetes ${K8S_VERSION})..."
      make build-proxmox-ubuntu-2404
      
      echo "=================================================================="
      echo "✅ Build finished!"
      echo "The new VM template is now available in Proxmox."
      echo "Note the Template ID (shown at the end of the Packer output)."
      echo ""
      echo "Next steps:"
      echo "1. In your ProxmoxCluster CRD, set template: <your-template-id>"
      echo "2. clusterctl init --infrastructure proxmox"
      echo "3. Deploy your Cluster CRD referencing this template."
      echo "=================================================================="

  - path: /cluster-api/clusterctl.yaml
    permissions: '0755'
    content: |
      apiVersion: clusterctl.cluster.x-k8s.io/v1beta1
      kind: Clusterctl
      metadata:
        name: clusterctl-v1beta1
        namespace: default
  - path: /cluster-api/clusterctl.yaml
    permissions: '0755'
    content: |
      providers:
        - name: "proxmox"
          url: "https://github.com/ionos-cloud/cluster-api-provider-proxmox/releases/latest/infrastructure-components.yaml"
          type: "InfrastructureProvider"
        - name: "in-cluster"
          url: "https://github.com/kubernetes-sigs/cluster-api-ipam-provider-in-cluster/releases/latest/ipam-components.yaml"
          type: "IPAMProvider"
      
      # CAPMOX variables (substituted into generated YAML)
      KUBERNETES_VERSION: "${K8S_VERSION}"
      
      ## -- Controller settings -- ##
      PROXMOX_URL: "https://pve.lab:8006"                       # The Proxmox VE host
      PROXMOX_TOKEN: "image-builder@pve!capi"                   # The Proxmox VE TokenID for authentication
      
      ## -- Required workload cluster default settings -- ##
      PROXMOX_SOURCENODE: "pve"                                 # The node that hosts the VM template to be used to provision VMs
      TEMPLATE_VMID: "${CAPI_NODE_VM_ID}"                       # The template VM ID used for cloning VMs
      ALLOWED_NODES: "[pve]"                                    # The Proxmox VE nodes used for VM deployments
      VM_SSH_KEYS: "id_ed25519"                                 # The ssh authorized keys used to ssh to the machines.
      
      ## -- networking configuration-- ##
      CONTROL_PLANE_ENDPOINT_IP: "10.0.0.39"                    # The IP that kube-vip is going to use as a control plane endpoint
      NODE_IP_RANGES: "[10.0.0.40-10.0.0.50]"                   # The IP ranges for Cluster nodes
      GATEWAY: "10.0.0.1"                                       # The gateway for the machines network-config.
      IP_PREFIX: "24"                                           # Subnet Mask in CIDR notation for your node IP ranges
      DNS_SERVERS: "[10.0.0.10,8.8.4.4]"                        # The dns nameservers for the machines network-config.
      BRIDGE: "vmbr0"                                           # The network bridge device for Proxmox VE VMs
      
      ## -- xl nodes -- ##
      BOOT_VOLUME_DEVICE: "scsi0"                               # The device used for the boot disk.
      BOOT_VOLUME_SIZE: "40"                                    # The size of the boot disk in GB.
      NUM_SOCKETS: "1"                                          # The number of sockets for the VMs.
      NUM_CORES: "4"                                            # The number of cores for the VMs.
      MEMORY_MIB: "8048"                                        # The memory size for the VMs.
      
      EXP_CLUSTER_RESOURCE_SET: "true"                          # This enables the ClusterResourceSet feature that we are using to deploy CNI
      CLUSTER_TOPOLOGY: "true"                                  # This enables experimental ClusterClass templating
  - path: /cluster-api/build-cluster-api-cluster.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      
      kind create cluster
      kubectl cluster-info
      
      PROXMOX_SECRET=$1
      export PROXMOX_SECRET
      
      # Finally, initialize the management cluster
      clusterctl init --infrastructure proxmox --ipam in-cluster


runcmd:
  - chown -R john:john /cluster-api

  - echo "Installing the Kubernetes CLI"
  - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
  - echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
  - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
  - kubectl version --client
  - echo "alias k=kubectl" >> /etc/bash.bashrc

  - echo "Installing kind"
  - curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
  - chmod +x ./kind
  - mv ./kind /usr/local/bin/kind

  - echo "Installing the Cluster API CLI"
  - curl -L https://github.com/kubernetes-sigs/cluster-api/releases/download/${CAPI_API_VERSION}/clusterctl-linux-amd64 -o clusterctl
  - install -o root -g root -m 0755 clusterctl /usr/local/bin/clusterctl
  - clusterctl version

  - echo "Installing HELM"
  - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
  - chmod 700 get_helm.sh
  - ./get_helm.sh

  - echo "export XDG_CONFIG_HOME=/root/.config" >> /etc/bash.bashrc